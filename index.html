<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erwan Gauriveau - Photographie</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Style CSS Intégré (Aucun blocage externe possible) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-h-screen: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }
        
        /* Section Principale Centrée */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('image-fond-cerf.jpg');
            background-size: cover;
            background-position: center;
        }
        .center-content {
            text-align: center;
            z-index: 10;
            padding: 0 20px;
            max-width: 600px;
            width: 100%;
        }
        
        /* Gestion stricte du Logo SVG */
        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            opacity: 0.9;
        }
        .logo-container svg {
            width: 100%;
            height: 100%;
        }
        
        /* Titre Signature */
        .main-title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin-bottom: 32px;
            color: #f3f4f6;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        @media (max-w: 768px) {
            .main-title { font-size: 2.5rem; }
        }
        
        /* Bouton Arrondi */
        .btn-galerie {
            display: inline-block;
            padding: 12px 32px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            text-decoration: none;
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.3s ease-in-out;
        }
        .btn-galerie:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Pied de page */
        footer {
            background-color: #000000;
            color: #a8a29e;
            padding: 48px 24px;
            border-top: 1px solid #1c1917;
            text-align: center;
            width: 100%;
        }
        .contact-link {
            text-decoration: none;
            color: #d6d3d1;
            display: block;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .contact-link:hover { color: #ffffff; }
        .contact-link p:first-child {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .contact-link p:last-child {
            font-size: 12px;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .social-icons {
            margin-bottom: 24px;
        }
        .social-icons a {
            color: #a8a29e;
            text-decoration: none;
            font-size: 14px;
            margin: 0 12px;
            transition: color 0.2s;
        }
        .social-icons a:hover { color: #ffffff; }
        .copyright {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #78716c;
            margin-bottom: 24px;
        }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid rgba(120, 113, 108, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .legal-links a {
            font-size: 11px;
            color: #78716c;
            text-decoration: none;
            transition: color 0.2s;
        }
        .legal-links a:hover { color: #d6d3d1; }
    </style>
</head>
<body>

    <!-- SECTION PRINCIPALE -->
    <section class="hero-section">
        <div class="center-content">
            <!-- Logo Cerf -->
            <div class="logo-container">
                <svg viewBox="0 0 100 100" fill="none" stroke="#ffffff" stroke-width="1.5">
                    <path d="M50,85 L50,45 M50,45 C40,30 30,35 25,20 M50,45 C60,30 70,35 75,20 M35,32 C25,25 20,15 15,25 M65,32 C75,25 80,15 85,25" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- Nom -->
            <h1 class="main-title">Erwan Gauriveau</h1>

            <!-- Bouton -->
            <a href="galerie.html" class="btn-galerie">Découvrir la Galerie</a>
        </div>
    </section>

    <!-- PIED DE PAGE -->
    <footer>
        <a href="contact.html" class="contact-link">
            <p>Une question sur un tirage ?</p>
            <p>Contacte-moi.</p>
        </a>

        <div class="social-icons">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="#">Facebook</a>
        </div>

        <p class="copyright">© 2026 Erwan Gauriveau. Tous droits réservés.</p>

        <div class="legal-links">
            <a href="politique-confidentialite.html">Politique de confidentialité</a>
            <a href="mentions-legales.html">Mentions Légales</a>
            <a href="cgv.html">Conditions Générales de Vente / CGV</a>
        </div>
    </footer>

</body>
</html>
