<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erwan Gauriveau </title>
    
    <!-- Ligne à ajouter sous la balise <title> -->
<link rel="icon" type="image/png" href="favicon.png">

    <!-- Google Fonts pour le bouton -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }
        
        /* TECHNIQUE ULTIME DE FLUIDITÉ : L'image est verrouillée en arrière-plan sans calculs lourds */
        .bg-fixed-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('image-fond-cerf.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1; /* Reste derrière tout le contenu */
            will-change: transform; /* Optimisation carte graphique */
        }
        
        /* Section d'accueil transparente pour laisser voir le fond */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }
        .center-content {
            text-align: center;
            z-index: 10;
            padding: 0 20px;
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        
        /* Taille du logo */
        .logo-image-container {
            width: 100%;
            max-width: 420px;
            opacity: 0.98;
        }
        .logo-image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        
        /* Bouton ENTIÈREMENT TRANSPARENT */
        .btn-galerie {
            display: inline-block;
            padding: 12px 36px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6); /* Bordure blanche fine */
            border-radius: 50px;
            text-decoration: none;
            background-color: transparent; /* Zéro couleur de fond */
            transition: all 0.3s ease-in-out;
            margin-top: 8px;
        }
        .btn-galerie:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Pied de page standardisé qui remonte de façon fluide */
        footer {
            background-color: #000000;
            color: #a8a29e;
            padding: 48px 24px;
            border-top: 1px solid #1c1917;
            text-align: center;
            width: 100%;
            position: relative;
            z-index: 20;
        }
        .contact-link {
            text-decoration: none;
            color: #d6d3d1;
            display: block;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .contact-link:hover { color: #ffffff; }
        .contact-link p:first-child {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .contact-link p:last-child {
            font-size: 12px;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .social-icons {
            margin-bottom: 24px;
        }
        .social-icons a {
            color: #a8a29e;
            text-decoration: none;
            font-size: 14px;
            margin: 0 12px;
            transition: color 0.2s;
        }
        .social-icons a:hover { color: #ffffff; }
        .copyright {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #78716c;
            margin-bottom: 24px;
        }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid rgba(120, 113, 108, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .legal-links a {
            font-size: 11px;
            color: #78716c;
            text-decoration: none;
            transition: color 0.2s;
        }
        .legal-links a:hover { color: #d6d3d1; }
    </style>
</head>
<body>

    <!-- Calque d'arrière-plan fixe et super fluide -->
    <div class="bg-fixed-layer"></div>

    <!-- SECTION PRINCIPALE -->
    <section class="hero-section">
        <div class="center-content">
            <div class="logo-image-container">
                <img src="mon-logo.png" alt="Logo Erwan Gauriveau">
            </div>
            <div>
                <a href="galerie.html" class="btn-galerie">Découvrir la Galerie</a>
            </div>
        </div>
    </section>

    <!-- PIED DE PAGE -->
    <footer>
        <a href="contact.html" class="contact-link">
            <p>Une question sur un tirage ?</p>
            <p>Contacte-moi.</p>
        </a>
        <div class="social-icons">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="#">Facebook</a>
        </div>
        <p class="copyright">© 2026 Erwan Gauriveau. Tous droits réservés.</p>
        <div class="legal-links">
            <a href="politique-confidentialite.html">Politique de confidentialité</a>
            <a href="mentions-legales.html">Mentions Légales</a>
            <a href="cgv.html">Conditions Générales de Vente / CGV</a>
        </div>
    </footer>

</body>
</html>
