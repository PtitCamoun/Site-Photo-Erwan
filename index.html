*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Montserrat', sans-serif;
  background:#000;
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;

.bg-fixed-layer{
  position:fixed;
  top:0;left:0;width:100vw;height:100vh;
  background-image:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),url('image-fond-cerf.jpg');

.hero-section{

  background:transparent;
}
.center-content{
  text-align:center;z-index:10;padding:0 20px;
  max-width:800px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:24px;
}
.logo-image-container{width:100%;max-width:420px;opacity:0.98;}
.logo-image-container img{width:100%;height:auto;object-fit:contain;}
.btn-galerie{
  display:inline-block;padding:12px 36px;font-size:10px;
  text-transform:uppercase;letter-spacing:2.5px;color:#fff;
  border:1px solid rgba(255,255,255,0.6);border-radius:50px;
  text-decoration:none;background-color:transparent;
  transition:all 0.3s ease-in-out;margin-top:8px;
}
.btn-galerie:hover{background:#fff;color:#000;border-color:#fff;}

.contact-link{text-decoration:none;color:#d6d3d1;display:block;margin-bottom:24px;}

.contact-link p:last-child{font-size:12px;text-decoration:underline;text-underline-offset:4px;}
.social-icons-svg{
  display:flex;justify-content:center;align-items:center;
  gap:24px;margin-bottom:24px;
}
.social-icons-svg a{color:#a8a29e;transition:color 0.2s;}
.social-icons-svg a:hover{color:#fff;}
.social-icons-svg svg{width:18px;height:18px;fill:currentColor;display:block;}
.copyright{font-size:10px;margin-bottom:24px;letter-spacing:2px;text-transform:uppercase;color:#78716c;}
.legal-links{
  display:flex;justify-content:center;gap:24px;flex-wrap:wrap;
  padding-top:16px;border-top:1px solid rgba(120,113,108,0.1);
  max-width:600px;margin:0 auto;
}
.legal-links a{font-size:11px;color:#78716c;text-decoration:none;transition:color 0.2s;}
.legal-links a:hover{color:#d6d3d1;}
