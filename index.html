<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erwan Gauriveau - Photographie</title>
    
    <!-- Google Fonts pour le bouton -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }
        
        /* Section d'accueil principale avec correction de l'extension .JPG */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('image-fond-cerf.JPG');
            background-size: cover;
            background-position: center;
        }
        .center-content {
            text-align: center;
            z-index: 10;
            padding: 0 20px;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }
        
        /* Conteneur du logo sans rond, tailles respectées fidèlement */
        .logo-image-container {
            width: 100%;
            max-width: 320px;
            opacity: 0.95;
        }
        .logo-image-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        
        /* Bouton élégant calqué sur la maquette */
        .btn-galerie {
            display: inline-block;
            padding: 10px 28px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            text-decoration: none;
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.3s ease-in-out;
        }
        .btn-galerie:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Pied de page standardisé */
        footer {
            background-color: #000000;
            color: #a8a29e;
            padding: 48px 24px;
            border-top: 1px solid #1c1917;
            text-align: center;
            width: 100%;
        }
        .contact-link {
            text-decoration: none;
            color: #d6d3d1;
            display: block;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .contact-link:hover { color: #ffffff; }
        .contact-link p:first-child {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .contact-link p:last-child {
            font-size: 12px;
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        .social-icons {
            margin-bottom: 24px;
        }
        .social-icons a {
            color: #a8a29e;
            text-decoration: none;
            font-size: 14px;
            margin: 0 12px;
            transition: color 0.2s;
        }
        .social-icons a:hover { color: #ffffff; }
        .copyright {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #78716c;
            margin-bottom: 24px;
        }
        .legal-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            padding-top: 16px;
            border-top: 1px solid rgba(120, 113, 108, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .legal-links a {
            font-size: 11px;
            color: #78716c;
            text-decoration: none;
            transition: color 0.2s;
        }
        .legal-links a:hover { color: #d6d3d1; }
    </style>
</head>
<body>

    <!-- SECTION PRINCIPALE AVEC FOND ET LOGO CENTRÉS -->
    <section class="hero-section">
        <div class="center-content">
            <!-- Votre logo officiel avec votre texte intégré -->
            <div class="logo-image-container">
                <img src="mon-logo.png" alt="Logo Erwan Gauriveau">
            </div>

            <!-- Bouton Découvrir -->
            <div>
                <a href="galerie.html" class="btn-galerie">Découvrir la Galerie</a>
            </div>
        </div>
    </section>

    <!-- PIED DE PAGE -->
    <footer>
        <a href="contact.html" class="contact-link">
            <p>Une question sur un tirage ?</p>
            <p>Contacte-moi.</p>
        </a>

        <div class="social-icons">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="#">Facebook</a>
        </div>

        <p class="copyright">© 2026 Erwan Gauriveau. Tous droits réservés.</p>

        <div class="legal-links">
            <a href="politique-confidentialite.html">Politique de confidentialité</a>
            <a href="mentions-legales.html">Mentions Légales</a>
            <a href="cgv.html">Conditions Générales de Vente / CGV</a>
        </div>
    </footer>

</body>
</html>
