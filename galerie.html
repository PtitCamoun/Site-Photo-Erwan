<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" 
content="width=device-width">
<title>Galerie</title>
<link rel="icon" 
type="image/png" 
href="favicon.png">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:sans-serif;
  background:#fff;
  color:#000;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
header{
  background:#000;
  color:#fff;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:50;
}
.nav-logo-link{
  display:block;
  height:75px; 
}
.nav-logo-link img{
  height:100%;
  object-fit:contain;
}
nav{
  display:flex;
  gap:15px;
}
nav a{
  font-size:11px;
  text-transform:uppercase;
  text-decoration:none;
  color:#a8a29e;
}
nav a:hover,
nav a.active{
  color:#fff;
}
.cart-btn{
  background:#1c1917;
  padding:4px 8px;
  border-radius:4px;
}
main{
  width:100%;
  max-width:1400px;
  margin:0 auto;
  padding:30px 20px;
  flex-grow:1;
}
.gallery-info{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#78716c;
  margin-bottom:30px;
  border-bottom:1px solid #f5f5f4;
  padding-bottom:10px;
}
.select-tri{
  font-size:11px;
  color:#78716c;
  background:transparent;
  border:none;
  outline:none;
}
.products-grid{
  display:grid;
  grid-template-cols:1fr;
  gap:30px;
}
@media(min-width:600px){
  .products-grid{
    grid-template-cols:1fr 1fr;
  }
}
@media(min-width:1000px){
  .products-grid{
    grid-template-cols:1fr 1fr 1fr;
  }
}
.product-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
}
.image-container{
  width:100%;
  background:#f5f5f4;
  border:1px solid #e7e5e4;
  margin-bottom:10px;
}
.image-container img{
  width:100%;
  height:auto;
  display:block;
}
.product-title{
  font-size:11px;
  text-transform:uppercase;
}
footer{
  background:#000;
  color:#a8a29e;
  padding:40px 20px;
  text-align:center;
}
.contact-link{
  text-decoration:none;
  color:#d6d3d1;
  display:block;
  margin-bottom:20px;
}
.social-icons{
  margin-bottom:20px;
}
.social-icons a{
  color:#a8a29e;
  text-decoration:none;
  margin:0 10px;
}
.copyright{
  font-size:10px;
  margin-bottom:20px;
}
.legal-links{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  padding-top:10px;
  border-top:1px solid #222;
}
.legal-links a{
  font-size:11px;
  color:#78716c;
  text-decoration:none;
}
</style>
</head>
<body>

<header>
<a href="index.html" 
class="nav-logo-link">
<img src="mon-logo.png" 
alt="Logo">
</a>
<nav>
<a href="index.html">Accueil</a>
<a href="galerie.html" 
class="active">Galerie</a>
<a href="contact.html">Contact</a>
<a href="panier.html" 
class="cart-btn">0,00 €</a>
</nav>
</header>

<main>
<div class="gallery-info">
<div id="txt-c">Calcul...</div>
<div>
<select class="select-tri">
<option>Plus récent</option>
<option>Prix croissant</option>
<option>Prix décroissant</option>
</select>
</div>
</div>

<div class="products-grid">

<a href="produit-faon.html" 
class="product-card">
<div class="image-container">
<img src="faon-lac.png" 
alt="Faon">
</div>
<div class="product-title">
Faon bord de lac
</div>
</a>

<a href="produit-cerf.html" 
class="product-card">
<div class="image-container">
<img src="cerf-brame.JPG" 
alt="Cerf">
</div>
<div class="product-title">
Cerf qui brame
</div>
</a>

</div>
</main>

<footer>
<a href="contact.html" 
class="contact-link">
<p>Une question ?</p>
<p>Contacte-moi.</p>
</a>
<div class="social-icons">
<a href="https://instagram.com"
target="_blank">Instagram</a>
</div>
<p class="copyright">
© 2026 Erwan Gauriveau.
</p>
<div class="legal-links">
<a href="cgv.html">CGV</a>
<a href="mentions.html">Mentions</a>
</div>
</footer>

<script>
document.addEventListener(
"DOMContentLoaded",
function(){
var n=document
.querySelectorAll(
'.product-card').length;
document.getElementById('txt-c')
.textContent=n+" résultats";
});
</script>
</body>
</html>
