<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cloudflare.com">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:sans-serif;
  background:#fff;
  color:#000;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
header{
  background:#000;
  color:#fff;
  padding:12px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:50;
}
.nav-logo-link{
  display:block;
  height:75px; 
}
.nav-logo-link img{
  height:100%;
  object-fit:contain;
}
nav{
  display:flex;
  align-items:center;
  gap:28px;
}
nav a{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  text-decoration:none;
  color:#a8a29e;
  font-weight:500;
}
nav a:hover,
nav a.active{
  color:#fff;
}
nav a.active {
  border-bottom:1px solid #fff;
  padding-bottom:2px;
}
.cart-btn-fixed{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(28,25,23,0.6);
  padding:6px 12px;
  border-radius:4px;
  text-decoration:none;
  color:#e7e5e4;
}
.cart-icon-container{
  position:relative;
}
.cart-badge{
  position:absolute;
  top:-6px;
  right:-8px;
  background:#fff;
  color:#000;
  font-size:9px;
  font-weight:bold;
  width:14px;
  height:14px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
main{
  width:100%;
  max-width:1400px;
  margin:0 auto;
  padding:40px 24px;
  flex-grow:1;
}
.gallery-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  color:#78716c;
  margin-bottom:40px;
  border-bottom:1px solid #f5f5f4;
  padding-bottom:16px;
  letter-spacing:1px;
}
.select-tri{
  font-size:11px;
  color:#78716c;
  background:transparent;
  border:none;
  outline:none;
  cursor:pointer;
}

/* BLOCAGE STRICT : Force 3 colonnes horizontales sans exception */
.products-grid{
  display:grid !important;
  grid-template-cols: repeat(3, minmax(0, 1fr)) !important;
  gap:24px;
  width:100%;
  align-items:start;
}

.product-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#000;
  width:100%;
}
.image-container{
  width:100%;
  background:#f5f5f4;
  border:1px solid #e7e5e4;
  margin-bottom:16px;
  box-shadow:0 4px 6px -1px rgba(0,0,0,0.02);
}
.image-container img{
  width:100%;
  height:auto;
  display:block;
}
.product-title{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:#57534e;
  text-align:center;
}
footer{
  background:#000;
  color:#a8a29e;
  padding:48px 24px;
  text-align:center;
  width:100%;
}
.contact-link{
  text-decoration:none;
  color:#d6d3d1;
  display:block;
  margin-bottom:24px;
}
.contact-link p:first-child {
  font-size:14px;
  font-weight:300;
  letter-spacing:1px;
  margin-bottom:4px;
}
.contact-link p:last-child {
  font-size:12px;
  text-decoration:underline;
  text-underline-offset:4px;
}
.social-icons{
  margin-bottom:24px;
}
.social-icons a{
  color:#a8a29e;
  text-decoration:none;
  margin:0 12px;
  font-size:14px;
}
.copyright{
  font-size:10px;
  margin-bottom:24px;
  letter-spacing:2px;
  text-transform:uppercase;
}
.legal-links{
  display:flex;
  justify-content:center;
  gap:24px;
  flex-wrap:wrap;
  padding-top:16px;
  border-top:1px solid #1c1917;
}
.legal-links a{
  font-size:11px;
  color:#78716c;
  text-decoration:none;
}
</style>
</head>
<body>

<header>
<a href="index.html" class="nav-logo-link">
<img src="mon-logo.png" alt="Logo">
</a>
<nav>
<a href="index.html">Accueil</a>
<a href="galerie.html" class="active">Galerie</a>
<a href="a-propos.html">À Propos</a>
<a href="contact.html">Contact</a>
<a href="panier.html" class="cart-btn-fixed">
<span>0,00 €</span>
<div class="cart-icon-container">
<i class="fa-solid fa-shopping-bag"></i>
<div class="cart-badge">0</div>
</div>
</a>
</nav>
</header>

<main>
<div class="gallery-info">
<div id="txt-c">Calcul...</div>
<div>
<select class="select-tri">
<option>Tri du plus récent au plus ancien</option>
<option>Tri du plus ancien au plus récent</option>
<option>Tri par prix croissant</option>
<option>Tri par prix décroissant</option>
</select>
</div>
</div>

<div class="products-grid">

<!-- Photo 1 -->
<a href="produit-faon.html" class="product-card">
<div class="image-container">
<img src="faon-lac.png" alt="Faon">
</div>
<div class="product-title">Faon bord de lac</div>
</a>

<!-- Photo 2 -->
<a href="produit-cerf.html" class="product-card">
<div class="image-container">
<img src="cerf-brame.JPG" alt="Cerf">
</div>
<div class="product-title">Cerf qui brame</div>
</a>

<!-- Photo 3 -->
<a href="produit-cerf-2.html" class="product-card">
<div class="image-container">
<img src="cerf-brame.JPG" alt="Cerf 2">
</div>
<div class="product-title">Cerf majestueux</div>
</a>

</div>
</main>

<footer>
<a href="contact.html" class="contact-link">
<p>Une question sur un tirage ?</p>
<p>Contacte-moi.</p>
</a>
<div class="social-icons">
<a href="https://instagram.com" 
target="_blank" rel="noopener noreferrer">Instagram</a>
<a href="#">Facebook</a>
</div>
<p class="copyright">
© 2026 Erwan Gauriveau. Tous droits réservés.
</p>
<div class="legal-links">

</footer>

<script>
document.addEventListener("DOMContentLoaded",function(){
var n=document.querySelectorAll('.product-card').length;
var txt=n<=1?" résultat affiché":" résultats affichés";
document.getElementById('txt-c').textContent=n+txt;
});
</script>
</body>
</html>
