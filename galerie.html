<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:sans-serif;background:#fff;color:#000;
  min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;
}
header{
  background:#000;color:#fff;padding:12px 40px;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:50;
}
.nav-logo-link{display:block;height:75px;}
.nav-logo-link img{height:100%;object-fit:contain;}
nav{display:flex;align-items:center;gap:28px;}
nav a{
  font-size:11px;text-transform:uppercase;letter-spacing:2px;
  text-decoration:none;color:#a8a29e;font-weight:500;
}
nav a:hover,nav a.active{color:#fff;}
nav a.active{border-bottom:1px solid #fff;padding-bottom:2px;}
.cart-btn-fixed{
  display:flex;align-items:center;gap:8px;
  background:rgba(28,25,23,0.6);padding:6px 12px;
  border-radius:4px;text-decoration:none;color:#e7e5e4;
}
.cart-icon-container{position:relative;}
.cart-badge{
  position:absolute;top:-6px;right:-8px;background:#fff;color:#000;
  font-size:9px;font-weight:bold;width:14px;height:14px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
}
main{width:100%;max-width:1400px;margin:0 auto;padding:40px 24px;flex-grow:1;}
.gallery-info{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:#78716c;margin-bottom:40px;
  border-bottom:1px solid #f5f5f4;padding-bottom:16px;letter-spacing:1px;
}
.select-tri{font-size:11px;color:#78716c;background:transparent;border:none;outline:none;cursor:pointer;}
.products-grid{
  display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;
  gap:24px;width:100%;align-items:start;
}
.product-card{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#000;flex:1 !important;min-width:0;}
.image-container{width:100%;background:#f5f5f4;border:1px solid #e7e5e4;margin-bottom:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.02);}
.image-container img{width:100%;height:auto;display:block;}
.product-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#57534e;text-align:center;}

footer{
  background:#000;color:#a8a29e;padding:48px 24px;
  border-top:1px solid #1c1917;text-align:center;width:100%;
}
.contact-link{text-decoration:none;display:block;margin-bottom:24px;}
.contact-link p:first-child{font-size:14px;font-weight:300;letter-spacing:1px;color:#e7e5e4 !important;margin-bottom:4px;}
.contact-link p:last-child{font-size:12px;color:#a8a29e !important;}
.contact-link:hover p:first-child{color:#fff !important;}
.contact-link:hover p:last-child{color:#fff !important;}
.social-icons-svg{display:flex;justify-content:center;align-items:center;gap:24px;margin-bottom:24px;}
.social-icons-svg a{color:#a8a29e;transition:color 0.2s;}
.social-icons-svg a:hover{color:#fff;}
.social-icons-svg svg{width:18px;height:18px;fill:currentColor;display:block;}
.copyright{font-size:10px;margin-bottom:24px;letter-spacing:2px;text-transform:uppercase;color:#78716c;}
.legal-links{
  display:flex;justify-content:center;gap:24px;flex-wrap:wrap;
  padding-top:16px;border-top:1px solid #1c1917;
}
.legal-links a{font-size:11px;color:#78716c;text-decoration:none;}
</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var conteneur = document.getElementById('products-container');
    var photos = Array.from(conteneur.querySelectorAll('.product-card'));
    var n = photos.length;
    var txt = n <= 1 ? " résultat affiché" : " résultats affichés";
    document.getElementById('txt-c').textContent = n + txt;
    var selectTri = document.getElementById('select-tri');
    selectTri.addEventListener('change', function() {
        var critere = this.value;
        photos.sort(function(a, b) {
            if (critere === 'recent') return parseInt(b.getAttribute('data-date')) - parseInt(a.getAttribute('data-date'));
            if (critere === 'ancien') return parseInt(a.getAttribute('data-date')) - parseInt(b.getAttribute('data-date'));
            if (critere === 'prix-croissant') return parseInt(a.getAttribute('data-price')) - parseInt(b.getAttribute('data-price'));
            if (critere === 'prix-decroissant') return parseInt(b.getAttribute('data-price')) - parseInt(a.getAttribute('data-price'));
            if (critere === 'alphabetique') return a.getAttribute('data-title').localeCompare(b.getAttribute('data-title'));
            return 0;
        });
        photos.forEach(function(photo) { conteneur.appendChild(photo); });
    });
});
</script>
